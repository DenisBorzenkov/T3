kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# 1 control-plane + 5 workers across the 3 simulated AWS availability zones
# (zone-a:2, zone-b:2, zone-c:1). More nodes give the HPA room to scale out while
# topologySpreadConstraints still keep replicas balanced across zones.
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-c
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
