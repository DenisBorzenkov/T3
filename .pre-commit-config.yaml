# Pre-commit hooks for this repo: Kubernetes manifests + bash test harness + GitHub Actions.
# Install:  pre-commit install        Run on everything:  pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]

repos:
  # --- General hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs

  # --- Bash quality (test/run-test.sh) ---
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # --- YAML lint (manifests + workflows) ---
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]

  # --- GitHub Actions workflow lint ---
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # --- Secret scanning (DB creds must never be committed again) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
