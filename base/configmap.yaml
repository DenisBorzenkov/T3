apiVersion: v1
kind: ConfigMap
metadata:
  name: api-server-config
  namespace: default
  labels:
    app: api-server
data:
  # Only non-sensitive config lives here now. DATABASE_URL moved to the Secret.
  LOG_LEVEL: "info"   # was "debug" — noisy, slower, can leak sensitive data in prod
  CACHE_TTL: "300"
