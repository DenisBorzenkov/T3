apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production set. Apply with:  kubectl apply -k .
# The `api-server-db` Secret is intentionally NOT in git — provision it out-of-band
# (External Secrets Operator / Vault in prod; from a GitHub Actions secret in CI) before
# this apply. The Deployment references it by name.
# VPA is applied separately because it needs the VPA operator/CRDs installed first:
#   kubectl apply -f vpa.yaml
namespace: default
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
